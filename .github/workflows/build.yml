name: Build AMW Remote APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create & Configure AMW Remote Project
        run: |
          flutter create --org com.amw.remote --platforms android amw_app
          cp main.dart amw_app/lib/main.dart
          mkdir -p amw_app/assets
          cp icon.* amw_app/assets/icon.jpg || true
          
          cd amw_app
          sed -i 's/<application/<uses-permission android:name="android.permission.TRANSMIT_IR" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="amw_app"/android:label="AMW Remote"/' android/app/src/main/AndroidManifest.xml
          
          # توليد أيقونة التطبيق من صورتك
          if [ -f "assets/icon.jpg" ]; then
            flutter pub add dev:flutter_launcher_icons
            cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.jpg"
            adaptive_icon_background: "#0B1120"
            adaptive_icon_foreground: "assets/icon.jpg"
          EOF
            dart run flutter_launcher_icons
          fi
          
          # كود Kotlin للتحكم المباشر في IR ودعم تردد 36kHz و 38kHz
          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt")
          cat << 'EOF' > "$MAIN_KT"
          package com.amw.remote.amw_app

          import android.content.Context
          import android.hardware.ConsumerIrManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "starled_ir_channel"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val irManager = getSystemService(Context.CONSUMER_IR_SERVICE) as? ConsumerIrManager
                      when (call.method) {
                          "hasIrEmitter" -> {
                              result.success(irManager?.hasIrEmitter() ?: false)
                          }
                          "transmit" -> {
                              val patternList = call.argument<List<Int>>("pattern")
                              val freq = call.argument<Int>("frequency") ?: 38000
                              if (irManager != null && irManager.hasIrEmitter() && patternList != null) {
                                  irManager.transmit(freq, patternList.toIntArray())
                                  result.success(true)
                              } else {
                                  result.error("IR_UNAVAILABLE", "IR Blaster not available", null)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd amw_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMW-Remote-APK
          path: amw_app/build/app/outputs/flutter-apk/app-release.apk
